name: Deploy instant pe site-uri

# Rulează la fiecare push pe main (modificări reale de temă) și declanșează
# deploy-ul instant pe toate site-urile din fleet. Ignoră doc-urile și
# fișierele de CI ca să nu facă redeploy inutil când se editează workflow-ul.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/**'
  workflow_dispatch: {}   # buton „Run workflow" pentru deploy manual la cerere

# Nu rulăm două deploy-uri în paralel (ultimul push câștigă coada).
concurrency:
  group: magpress-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Guard: rulează doar în repo-ul canonic (nu pe fork-uri).
    if: github.repository == 'kreatorteam-collab/magpress'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (pentru scriptul de deploy)
        uses: actions/checkout@v4

      - name: Fan-out deploy instant către fleet
        env:
          MAGPRESS_FLEET: ${{ secrets.MAGPRESS_FLEET }}
          GITHUB_SHA: ${{ github.sha }}
        run: node .github/scripts/deploy-fleet.mjs
